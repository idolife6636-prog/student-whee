<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>期中課程學員心得分享｜1–28號抽人轉盤</title>
<style>
:root{--navy:#10265e;--blue:#1769e0;--gold:#ffd45a;--cream:#fff7e6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Microsoft JhengHei",sans-serif;color:var(--navy);
background:radial-gradient(circle at 15% 15%,#fff2bd,transparent 30%),linear-gradient(135deg,#fff8e9,#f8d8a8 55%,#c76a31);
display:flex;justify-content:center;align-items:center;padding:22px}
main{width:min(100%,900px);text-align:center;background:#ffffffdc;border:3px solid #fff;border-radius:26px;padding:24px;box-shadow:0 18px 50px #60300038}
.kicker{display:inline-block;background:#075746;color:white;padding:9px 18px;border-radius:30px;font-weight:800;letter-spacing:1px}
h1{font-size:clamp(25px,4vw,42px);margin:14px 0 5px;color:#a93512}
.subtitle{font-size:clamp(15px,2.2vw,21px);font-weight:700;margin:0 0 20px}
.wheel-wrap{position:relative;width:min(76vw,490px);margin:0 auto 18px}
canvas{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 9px #44230035)}
.pointer{position:absolute;z-index:2;left:50%;top:-8px;transform:translateX(-50%);width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-top:48px solid #e23b1c;filter:drop-shadow(0 3px 2px #633)}
.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:20%;aspect-ratio:1;border-radius:50%;background:linear-gradient(145deg,#fff,#ffe17a);border:5px solid white;box-shadow:0 0 0 4px #1769e0;display:grid;place-items:center;font-weight:900;color:#12306d;font-size:clamp(12px,2vw,18px);pointer-events:none}
button{border:0;border-radius:14px;padding:13px 23px;font-size:18px;font-weight:800;cursor:pointer;margin:5px;box-shadow:0 4px 0 #8d3e15;transition:transform .12s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8d3e15}
#spin{background:#1265d8;color:white}#reset{background:#ffcf4b;color:#442100}
.result{font-size:clamp(22px,4vw,34px);font-weight:900;margin:14px auto 4px;min-height:44px;color:#b43714}
.hint{font-size:14px;color:#5e5144;margin-top:10px}
@media(max-width:520px){main{padding:16px 10px}.wheel-wrap{width:min(86vw,390px)}button{font-size:16px;padding:12px 18px}}
</style>
</head>
<body>
<main>
  <div class="kicker">崇光社大｜115 秋季班</div>
  <h1>期中課程學員心得分享</h1>
  <p class="subtitle">AI 智慧生活的學習成果與實際應用</p>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheel" width="900" height="900" aria-label="1到28號抽人轉盤"></canvas>
    <div class="center">心得<br>分享</div>
  </div>
  <button id="spin">開始抽選</button>
  <button id="reset">重新開始</button>
  <div class="result" id="result" aria-live="polite">準備好了嗎？抽出今天的分享者！</div>
  <div class="hint">每位學員都有機會，請分享一項學習收穫或實際應用經驗。</div>
</main>
<script>
const canvas=document.getElementById('wheel'),ctx=canvas.getContext('2d');
const n=28,step=Math.PI*2/n,colors=['#1769e0','#f7c744','#e65b2f','#13836b','#6d55c8','#f28b35','#258bb8'];
let angle=0,spinning=false;
function draw(){
 const c=canvas.width/2,r=canvas.width/2-14;
 ctx.clearRect(0,0,canvas.width,canvas.height);
 for(let i=0;i<n;i++){
  const a=angle+i*step-Math.PI/2;
  ctx.beginPath();ctx.moveTo(c,c);ctx.arc(c,c,r,a,a+step);ctx.closePath();
  ctx.fillStyle=colors[i%colors.length];ctx.fill();
  ctx.strokeStyle='#fff7e8';ctx.lineWidth=5;ctx.stroke();
  ctx.save();ctx.translate(c,c);ctx.rotate(a+step/2);
  ctx.textAlign='right';ctx.textBaseline='middle';
  ctx.fillStyle=(i%colors.length===1)?'#492800':'#fff';
  ctx.font='bold 32px "Microsoft JhengHei",sans-serif';
  ctx.fillText(String(i+1)+'號',r-24,0);
  ctx.restore();
 }
 ctx.beginPath();ctx.arc(c,c,r,0,Math.PI*2);ctx.strokeStyle='#fff';ctx.lineWidth=10;ctx.stroke();
}
draw();
function winner(){let a=(((-angle)%(Math.PI*2))+Math.PI*2)%(Math.PI*2);return (Math.floor(a/step)%n)+1}
document.getElementById('spin').addEventListener('click',()=>{
 if(spinning)return;spinning=true;
 document.getElementById('spin').disabled=true;
 document.getElementById('result').textContent='轉盤旋轉中……';
 const start=angle,extra=(Math.PI*2)*(6+Math.random()*4)+Math.random()*Math.PI*2;
 const duration=4200,t0=performance.now();
 function frame(now){
  const t=Math.min(1,(now-t0)/duration),ease=1-Math.pow(1-t,4);
  angle=start+extra*ease;draw();
  if(t<1)requestAnimationFrame(frame);
  else{
   spinning=false;document.getElementById('spin').disabled=false;
   document.getElementById('result').textContent='本次分享者：第 '+winner()+' 號學員';
  }
 }
 requestAnimationFrame(frame);
});
document.getElementById('reset').addEventListener('click',()=>{
 if(spinning)return;angle=0;draw();document.getElementById('result').textContent='準備好了嗎？抽出今天的分享者！';
});
</script>
</body>
</html>
